<header class="site-header">
  <div class="container nav">

    <!-- Logo -->
    <a class="brand" routerLink="/" aria-label="Qyveriq Technologies home" (click)="closeMobileMenu()">
      <img src="assets/qyveriq_logo.png" alt="Qyveriq Technologies">
    </a>

    <!-- Desktop navigation -->
    <nav class="desktop-nav" aria-label="Main navigation">
      <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a>
      <a routerLink="/csv-training" routerLinkActive="active" (click)="closeMobileMenu()">CSV Training</a>
      <a routerLink="/reviews" routerLinkActive="active" (click)="closeMobileMenu()">Reviews</a>
      <a class="contact-link" routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact Us</a>
    </nav>

    <!-- Mobile hamburger -->
    <button
      type="button"
      class="mobile-menu-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Toggle navigation menu">

      <span [class.open]="isMobileMenuOpen"></span>
      <span [class.open]="isMobileMenuOpen"></span>
      <span [class.open]="isMobileMenuOpen"></span>
    </button>

  </div>

  <!-- Mobile navigation -->
  <nav class="mobile-nav" [class.mobile-nav-open]="isMobileMenuOpen" aria-label="Mobile navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">Home</a>
    <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a>
    <a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a>
    <a routerLink="/csv-training" routerLinkActive="active" (click)="closeMobileMenu()">CSV Training</a>
    <a routerLink="/reviews" routerLinkActive="active" (click)="closeMobileMenu()">Reviews</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact Us</a>

  </nav>
</header>
